<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · CivicEvents</title>
  <meta name="description" content="Create a CivicEvents account to register for city events." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <a href="#main" class="skip-link">Skip to main content</a>

  <main id="main" class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="flex items-center justify-center gap-2 mb-8">
        <svg class="h-9 w-9 text-indigo-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /><path d="M9 15l2 2 4-4" />
        </svg>
        <span class="text-2xl font-bold">Civic<span class="text-indigo-700">Events</span></span>
      </div>

      <section class="card p-6 sm:p-8" aria-labelledby="signup-title">
        <h1 id="signup-title" class="text-2xl font-bold">Create your account</h1>
        <p class="text-slate-600 mt-1">Register for events and get city updates.</p>

        <div id="form-alert" class="hidden mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert"></div>

        <form id="signup-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="full_name" class="label">Full name</label>
            <input id="full_name" name="full_name" type="text" autocomplete="name" required class="input" />
          </div>

          <div>
            <label for="email" class="label">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required class="input" />
          </div>

          <div>
            <label for="password" class="label">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="new-password" required
                     class="input pr-16" aria-describedby="strength-text password-rules" />
              <button type="button" class="toggle-password absolute inset-y-0 right-0 px-3 text-sm font-medium text-slate-600 hover:text-slate-900"
                      aria-controls="password" aria-pressed="false">Show</button>
            </div>

            <!-- Password strength meter -->
            <div class="mt-3">
              <div class="strength-bar" aria-hidden="true"><div id="strength-fill" class="strength-fill"></div></div>
              <p id="strength-text" class="mt-1 text-sm text-slate-600" aria-live="polite">Password strength: —</p>
            </div>
            <ul id="password-rules" class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-1 text-sm">
              <li data-rule="length" class="text-slate-600"><span aria-hidden="true">○</span> At least 8 characters</li>
              <li data-rule="lower" class="text-slate-600"><span aria-hidden="true">○</span> A lowercase letter</li>
              <li data-rule="upper" class="text-slate-600"><span aria-hidden="true">○</span> An uppercase letter</li>
              <li data-rule="number" class="text-slate-600"><span aria-hidden="true">○</span> A number</li>
              <li data-rule="special" class="text-slate-600"><span aria-hidden="true">○</span> A special character (!@#$…)</li>
            </ul>
          </div>

          <div>
            <label for="confirm_password" class="label">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required class="input" />
          </div>

          <button type="submit" id="signup-btn" class="btn btn-primary w-full">Create account</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
          Already have an account? <a href="login.html" class="link">Log in</a>
        </p>
      </section>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    $(function () {
      // ROLE GUARD 3: logged-in users don't need the signup page
      if (Auth.redirectIfLoggedIn()) return;

      const $form = $('#signup-form');
      const $alert = $('#form-alert');
      const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Strong password policy: min 8 chars, lowercase, uppercase, number, special char
      const RULES = {
        length: function (p) { return p.length >= 8; },
        lower: function (p) { return /[a-z]/.test(p); },
        upper: function (p) { return /[A-Z]/.test(p); },
        number: function (p) { return /\d/.test(p); },
        special: function (p) { return /[^A-Za-z0-9]/.test(p); },
      };
      const LEVELS = [
        { label: 'Very weak', color: '#b91c1c' },
        { label: 'Weak', color: '#c2410c' },
        { label: 'Fair', color: '#a16207' },
        { label: 'Good', color: '#15803d' },
        { label: 'Strong', color: '#166534' },
      ];

      function checkPassword(password) {
        let passed = 0;
        $.each(RULES, function (name, test) {
          const ok = test(password);
          if (ok) passed++;
          $('#password-rules [data-rule="' + name + '"]')
            .toggleClass('text-green-700', ok)
            .toggleClass('text-slate-600', !ok)
            .find('span').text(ok ? '✓' : '○');
        });
        return passed; // 0 to 5
      }

      // Update the strength meter as the user types
      $('#password').on('input', function () {
        const password = $(this).val();
        const score = checkPassword(password);
        if (!password) {
          $('#strength-fill').css({ width: '0%' });
          $('#strength-text').text('Password strength: —');
          return;
        }
        const level = LEVELS[Math.max(score - 1, 0)];
        $('#strength-fill').css({ width: (score / 5) * 100 + '%', backgroundColor: level.color });
        $('#strength-text').text('Password strength: ' + level.label);
      });

      $('.toggle-password').on('click', function () {
        const $input = $('#' + $(this).attr('aria-controls'));
        const show = $input.attr('type') === 'password';
        $input.attr('type', show ? 'text' : 'password');
        $(this).text(show ? 'Hide' : 'Show').attr('aria-pressed', String(show));
      });

      $form.on('submit', function (e) {
        e.preventDefault();
        UI.clearErrors($form);
        $alert.addClass('hidden').text('');

        const fullName = $('#full_name').val().trim();
        const email = $('#email').val().trim();
        const password = $('#password').val();
        const confirm = $('#confirm_password').val();

        // Client-side validation
        let valid = true;
        if (fullName.length < 2) { UI.fieldError('#full_name', 'Please enter your full name.'); valid = false; }
        if (!EMAIL_REGEX.test(email)) { UI.fieldError('#email', 'Please enter a valid email, e.g. name@example.com.'); valid = false; }
        if (checkPassword(password) < 5) { UI.fieldError('#password', 'Your password must meet all 5 requirements below.'); valid = false; }
        if (!confirm) { UI.fieldError('#confirm_password', 'Please confirm your password.'); valid = false; }
        else if (password !== confirm) { UI.fieldError('#confirm_password', 'Passwords do not match.'); valid = false; }
        if (!valid) { $form.find('[aria-invalid="true"]').first().trigger('focus'); return; }

        const $btn = $('#signup-btn');
        UI.setLoading($btn, true, 'Creating account...');

        // New accounts are always normal users. Admins are created by the system, never from this form.
        Api.post('/auth/signup', { full_name: fullName, email: email, password: password, role: 'user' }, { skipAuthRedirect: true })
          .then(function () {
            sessionStorage.setItem('civic_last_email', email);
            UI.setFlash('Account created! Please log in.', 'success');
            window.location.href = 'login.html';
          })
          .catch(function (err) {
            UI.setLoading($btn, false);
            // Email already registered
            if (err.status === 409 || /exist|already|taken/i.test(err.message)) {
              UI.fieldError('#email', 'An account with this email already exists. Try logging in instead.');
              $('#email').trigger('focus');
            } else {
              $alert.text(err.message).removeClass('hidden');
            }
          });
      });
    });
  </script>
</body>
</html>
