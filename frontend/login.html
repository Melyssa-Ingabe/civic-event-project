<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · CivicEvents</title>
  <meta name="description" content="Log in to CivicEvents to find city events, announcements and services." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <a href="#main" class="skip-link">Skip to main content</a>

  <main id="main" class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex items-center justify-center gap-2 mb-8">
        <svg class="h-9 w-9 text-indigo-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /><path d="M9 15l2 2 4-4" />
        </svg>
        <span class="text-2xl font-bold">Civic<span class="text-indigo-700">Events</span></span>
      </div>

      <section class="card p-6 sm:p-8" aria-labelledby="login-title">
        <h1 id="login-title" class="text-2xl font-bold">Welcome back</h1>
        <p class="text-slate-600 mt-1">Log in to see events, announcements and services in your city.</p>

        <!-- API errors (wrong password, server down...) appear here -->
        <div id="form-alert" class="hidden mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert"></div>

        <form id="login-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="email" class="label">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required class="input" />
          </div>

          <div>
            <label for="password" class="label">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required class="input pr-16" />
              <button type="button" class="toggle-password absolute inset-y-0 right-0 px-3 text-sm font-medium text-slate-600 hover:text-slate-900"
                      aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <input id="remember" type="checkbox" class="h-4 w-4 rounded border-slate-300 accent-indigo-700" />
            <label for="remember" class="text-sm text-slate-700">Keep me signed in on this device</label>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary w-full">Log in</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
          Don't have an account? <a href="signup.html" class="link">Sign up</a>
        </p>
      </section>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    $(function () {
      // ROLE GUARD 3: a user who is already logged in skips the login page
      if (Auth.redirectIfLoggedIn()) return;

      const $form = $('#login-form');
      const $alert = $('#form-alert');
      const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Pre-fill the email if the user just signed up
      const lastEmail = sessionStorage.getItem('civic_last_email');
      if (lastEmail) {
        $('#email').val(lastEmail);
        sessionStorage.removeItem('civic_last_email');
        $('#password').trigger('focus');
      }

      // Show / hide password
      $('.toggle-password').on('click', function () {
        const $input = $('#' + $(this).attr('aria-controls'));
        const show = $input.attr('type') === 'password';
        $input.attr('type', show ? 'text' : 'password');
        $(this).text(show ? 'Hide' : 'Show').attr('aria-pressed', String(show));
      });

      $form.on('submit', function (e) {
        e.preventDefault();
        UI.clearErrors($form);
        $alert.addClass('hidden').text('');

        const email = $('#email').val().trim();
        const password = $('#password').val();

        // Client-side validation before calling the API
        let valid = true;
        if (!email) { UI.fieldError('#email', 'Please enter your email address.'); valid = false; }
        else if (!EMAIL_REGEX.test(email)) { UI.fieldError('#email', 'Please enter a valid email, e.g. name@example.com.'); valid = false; }
        if (!password) { UI.fieldError('#password', 'Please enter your password.'); valid = false; }
        if (!valid) { $form.find('[aria-invalid="true"]').first().trigger('focus'); return; }

        const $btn = $('#login-btn');
        UI.setLoading($btn, true, 'Logging in...');

        // skipAuthRedirect: here a 401 means "wrong email/password", not "session expired"
        Api.post('/auth/login', { email: email, password: password }, { skipAuthRedirect: true })
          .then(function (res) {
            const data = res.data || {};
            if (!data.token || !data.user) {
              throw { message: 'Unexpected response from the server. Please try again.' };
            }
            // Save token + user in session or local storage depending on "Keep me signed in"
            Auth.save(data.token, data.user, $('#remember').is(':checked'));
            UI.setFlash('Welcome back, ' + data.user.full_name + '!', 'success');
            window.location.href = 'dashboard.html';
          })
          .catch(function (err) {
            UI.setLoading($btn, false);
            $alert.text(err.message).removeClass('hidden');
            $('#password').val('').trigger('focus');
          });
      });
    });
  </script>
</body>
</html>
