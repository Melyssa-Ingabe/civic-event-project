<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My registrations · CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="app-header"></div>

  <main id="main" class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-2xl sm:text-3xl font-bold">My registrations</h1>
    <p class="mt-1 text-slate-600">Events you've signed up for.</p>

    <div class="mt-6 inline-flex rounded-lg border border-slate-300 bg-white p-1" role="group" aria-label="Show registrations">
      <button type="button" data-tab="upcoming" aria-pressed="true" class="tab-btn px-4 py-2 rounded-md text-sm font-semibold">Upcoming</button>
      <button type="button" data-tab="past" aria-pressed="false" class="tab-btn px-4 py-2 rounded-md text-sm font-semibold">Past</button>
    </div>

    <p id="summary" class="mt-4 text-sm text-slate-600" aria-live="polite"></p>
    <ul id="registrations" class="mt-4 space-y-4"></ul>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events.js"></script>
  <script>
    $(function () {
      // ROLE GUARD 1: must be logged in
      if (!Auth.requireAuth()) return;

      // ROLE GUARD (user-only page): admins manage events and don't register for them
      if (Auth.isAdmin()) {
        UI.setFlash("Admins manage events and don't register for them.", 'info');
        window.location.href = 'events.html';
        return;
      }

      Layout.init({ active: 'events' });

      const esc = UI.escapeHtml;
      let items = [];
      let tab = 'upcoming';

      function load() {
        UI.showSkeleton('#registrations', 3, 'row');
        $('#summary').text('Loading your registrations…');

        Promise.all([
          EventsService.loadMyRegistrations(true),
          Api.cachedGet('/events', null, 30000),
        ])
          .then(function (results) {
            // Join each registration with its event details
            const eventsById = {};
            Api.toList(results[1]).forEach(function (e) { eventsById[e.id] = e; });
            items = results[0].map(function (reg) {
              return { reg: reg, event: Object.assign({}, reg, eventsById[reg.event_id] || {}, { id: reg.event_id }) };
            });
            render();
          })
          .catch(function (err) {
            $('#summary').text('');
            UI.showError('#registrations', err.message, load);
          });
      }

      function rowHtml(item) {
        const e = item.event;
        const st = EventsService.status(e);
        const url = 'event.html?id=' + encodeURIComponent(e.id);
        return `
          <li class="card overflow-hidden flex flex-col sm:flex-row">
            <div class="sm:w-56 shrink-0">${EventsService.mediaBox(e, 'h-40 sm:h-full')}</div>
            <div class="p-5 flex-1 flex flex-col gap-2">
              <div>${EventsService.statusBadge(st)}</div>
              <h2 class="text-lg font-semibold"><a href="${url}" class="hover:text-indigo-700 focus:outline-none focus-visible:underline">${esc(e.title || 'Event')}</a></h2>
              <p class="text-sm text-slate-600">${esc(EventsService.formatRange(e.starts_at, e.ends_at))}${e.location ? ' · ' + esc(e.location) : ''}</p>
              ${item.reg.created_at ? `<p class="text-xs text-slate-500">Registered ${UI.timeAgo(item.reg.created_at)}</p>` : ''}
              <div class="mt-auto pt-2 flex flex-wrap gap-2">
                <a href="${url}" class="btn btn-secondary btn-sm">View event</a>
                ${st !== 'past' ? `<button type="button" data-cancel="${esc(e.id)}" class="btn btn-danger btn-sm" aria-label="Cancel registration for ${esc(e.title)}">Cancel registration</button>` : ''}
              </div>
            </div>
          </li>`;
      }

      function render() {
        const upcoming = items.filter(function (i) { return EventsService.status(i.event) !== 'past'; })
          .sort(function (a, b) { return new Date(a.event.starts_at) - new Date(b.event.starts_at); });
        const past = items.filter(function (i) { return EventsService.status(i.event) === 'past'; })
          .sort(function (a, b) { return new Date(b.event.starts_at) - new Date(a.event.starts_at); });

        $('[data-tab="upcoming"]').text('Upcoming (' + upcoming.length + ')');
        $('[data-tab="past"]').text('Past (' + past.length + ')');
        $('.tab-btn').each(function () {
          const active = $(this).data('tab') === tab;
          $(this).attr('aria-pressed', String(active))
            .toggleClass('bg-indigo-700 text-white', active)
            .toggleClass('text-slate-700 hover:bg-slate-100', !active);
        });

        const list = tab === 'upcoming' ? upcoming : past;
        if (!list.length) {
          $('#summary').text('');
          UI.showEmpty('#registrations',
            tab === 'upcoming' ? "You haven't registered for any upcoming events." : 'No past events yet.',
            tab === 'upcoming' ? '<a href="events.html" class="btn btn-primary mt-4">Browse events</a>' : '');
          return;
        }
        $('#summary').text(list.length + ' ' + tab + ' event' + (list.length === 1 ? '' : 's'));
        $('#registrations').attr('aria-busy', 'false').html(list.map(rowHtml).join(''));
      }

      $('.tab-btn').on('click', function () {
        tab = $(this).data('tab');
        render();
      });

      $('#registrations').on('click', '[data-cancel]', function () {
        const $btn = $(this);
        const id = $btn.attr('data-cancel');
        const item = items.find(function (i) { return i.event.id === id; });
        UI.confirmDialog({
          title: 'Cancel your registration?',
          message: 'You will lose your spot for "' + item.event.title + '".',
          confirmText: 'Cancel registration',
        }).then(function (ok) {
          if (!ok) return;
          UI.setLoading($btn, true, 'Cancelling...');
          EventsService.cancel(id)
            .then(function () {
              items = items.filter(function (i) { return i.event.id !== id; });
              UI.toast('Registration cancelled.');
              render();
            })
            .catch(function (err) { UI.setLoading($btn, false); UI.toast(err.message, 'error'); });
        });
      });

      load();
    });
  </script>
</body>
</html>
