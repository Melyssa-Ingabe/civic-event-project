<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promo · CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="app-header"></div>

  <main id="main" class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <a href="promos.html" class="text-sm link">← All promos</a>
    <div id="content" class="mt-4"></div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/media.js"></script>
  <script>
    $(function () {
      // ROLE GUARD 1: any logged-in user can watch a published promo.
      // ROLE GUARD (UI): Edit / Publish / Delete are admin-only.
      if (!Auth.requireAuth()) return;
      Layout.init({ active: 'promos' });

      const esc = UI.escapeHtml;
      const isAdmin = Auth.isAdmin();
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const autoplay = params.get('play') === '1';
      let promo = null;
      let captionsUrl = null;

      function load() {
        if (!id) { UI.showEmpty('#content', 'No promo selected.'); return; }
        $('#content').html('<div class="animate-pulse space-y-4" aria-hidden="true"><div class="aspect-video bg-slate-200 rounded-2xl"></div><div class="h-8 bg-slate-200 rounded w-2/3"></div></div>');

        Api.get('/promos/' + encodeURIComponent(id))
          .then(function (res) {
            promo = res.data;
            // ROLE GUARD (UI): unpublished promos are hidden from normal users
            if (!promo || !MediaService.isVisible(promo)) {
              UI.showEmpty('#content', 'This promo is not available.', '<a href="promos.html" class="btn btn-primary mt-4">Back to promos</a>');
              return;
            }
            render();
          })
          .catch(function (err) {
            if (err.status === 404) UI.showEmpty('#content', "We couldn't find this promo.", '<a href="promos.html" class="btn btn-primary mt-4">Back to promos</a>');
            else UI.showError('#content', err.message, load);
          });
      }

      function render() {
        document.title = promo.title + ' · CivicEvents';
        const src = mediaUrl(promo.video_url);
        const hasCaptions = !!(promo.caption_url || promo.caption_text);

        $('#content').html(`
          <article>
            <div class="rounded-2xl overflow-hidden bg-black">
              <video id="promo-video" controls preload="metadata" playsinline crossorigin="anonymous"
                     class="w-full aspect-video" aria-label="Promo video: ${esc(promo.title)}">
                <source src="${esc(src)}" />
                <p class="p-4 text-white">Your browser can't play this video. <a href="${esc(src)}" download class="underline">Download it</a> instead.</p>
              </video>
            </div>
            <p id="video-error" class="hidden mt-3 rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-800" role="alert"></p>

            <div class="mt-3 flex flex-wrap items-center gap-3">
              ${hasCaptions ? '<button type="button" id="cc-toggle" class="btn btn-secondary btn-sm" aria-pressed="true">Captions: On</button>' : '<span class="text-sm text-slate-600">No captions available for this video.</span>'}
              <a href="${esc(src)}" download class="link text-sm">Download video</a>
            </div>

            <div class="mt-6 flex flex-wrap items-center gap-2">
              ${isAdmin ? MediaService.publishBadge(promo) : ''}
              <span class="text-sm text-slate-600">Posted <time datetime="${esc(promo.created_at)}">${esc(UI.formatDate(promo.created_at))}</time></span>
            </div>
            <h1 class="mt-2 text-2xl sm:text-3xl font-bold">${esc(promo.title)}</h1>
            <p class="mt-3 text-slate-700 whitespace-pre-line leading-relaxed">${esc(promo.description || '')}</p>

            <section class="mt-6 card p-5" aria-labelledby="transcript-heading">
              <h2 id="transcript-heading" class="text-lg font-semibold">Transcript</h2>
              ${promo.caption_text
                ? `<p class="mt-2 text-slate-700 whitespace-pre-line leading-relaxed">${esc(promo.caption_text)}</p>`
                : '<p class="mt-2 text-slate-600">No transcript was provided for this video.</p>'}
            </section>

            ${isAdmin ? `
            <div class="mt-6 flex flex-wrap gap-3">
              <a href="promo-form.html?id=${encodeURIComponent(promo.id)}" class="btn btn-primary">Edit</a>
              <button type="button" id="toggle-publish" class="btn btn-secondary">${promo.published === false ? 'Publish' : 'Unpublish'}</button>
              <button type="button" id="delete-btn" class="btn btn-danger">Delete</button>
            </div>` : ''}
          </article>`);

        setUpVideo();
      }

      function setUpVideo() {
        const video = document.getElementById('promo-video');

        // Captions: use the backend's caption file if there is one,
        // otherwise build a WebVTT track from caption_text once we know the duration.
        video.addEventListener('loadedmetadata', function () {
          if (video.querySelector('track')) return;
          if (captionsUrl) URL.revokeObjectURL(captionsUrl);
          const trackSrc = promo.caption_url ? mediaUrl(promo.caption_url) : MediaService.captionsTrackUrl(promo.caption_text, video.duration);
          if (!promo.caption_url) captionsUrl = trackSrc;
          if (!trackSrc) return;

          const track = document.createElement('track');
          track.kind = 'captions';
          track.srclang = 'en';
          track.label = 'English';
          track.src = trackSrc;
          track.default = true; // captions ON by default
          video.appendChild(track);
          if (video.textTracks[0]) video.textTracks[0].mode = 'showing';
        });

        video.addEventListener('error', showVideoError, true);

        if (autoplay) {
          video.play().catch(function () { /* the browser blocked autoplay; the user can press play */ });
        }
      }

      function showVideoError() {
        const src = mediaUrl(promo.video_url);
        $('#video-error').removeClass('hidden').html(
          "This video couldn't be played in your browser (some formats like .avi or .mkv aren't supported). " +
          '<a href="' + esc(src) + '" download class="link">Download it</a> to watch.');
      }

      // Captions on/off toggle
      $('#content').on('click', '#cc-toggle', function () {
        const track = document.getElementById('promo-video').textTracks[0];
        if (!track) return;
        const on = track.mode !== 'showing';
        track.mode = on ? 'showing' : 'hidden';
        $(this).attr('aria-pressed', String(on)).text('Captions: ' + (on ? 'On' : 'Off'));
      });

      $('#content').on('click', '#toggle-publish', function () {
        const publish = promo.published === false;
        UI.setLoading(this, true, publish ? 'Publishing...' : 'Unpublishing...');
        MediaService.setPublished('promos', promo.id, publish)
          .then(function () {
            promo.published = publish;
            UI.toast(publish ? 'Promo published.' : 'Promo unpublished.');
            render();
          })
          .catch(function (err) { UI.setLoading('#toggle-publish', false); UI.toast(err.message, 'error'); });
      });

      $('#content').on('click', '#delete-btn', function () {
        MediaService.remove('promos', promo, 'Promo').then(function (deleted) {
          if (deleted) { UI.setFlash('Promo deleted.'); window.location.href = 'promos.html'; }
        });
      });

      load();
    });
  </script>
</body>
</html>
