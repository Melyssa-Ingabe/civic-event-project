<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements · CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="app-header"></div>

  <main id="main" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold">Announcements</h1>
        <p class="mt-1 text-slate-600">Listen to the latest audio updates from the city.</p>
      </div>
      <a href="announcement-form.html" class="btn btn-primary" data-admin-only>+ New announcement</a>
    </div>

    <div class="mt-6 card p-4 grid gap-4 sm:grid-cols-3 items-end" role="search" aria-label="Filter announcements">
      <div class="sm:col-span-2">
        <label for="search" class="label">Search</label>
        <input id="search" type="search" class="input" placeholder="Search by title" />
      </div>
      <div data-admin-only>
        <label for="status" class="label">Status</label>
        <select id="status" class="input">
          <option value="">All</option>
          <option value="published">Published</option>
          <option value="draft">Drafts</option>
        </select>
      </div>
    </div>

    <section class="mt-8" aria-labelledby="results-heading">
      <h2 id="results-heading" class="sr-only">Announcement list</h2>
      <p id="summary" class="text-sm text-slate-600 mb-4" aria-live="polite"></p>
      <div id="list" class="grid gap-4 md:grid-cols-2"></div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/media.js"></script>
  <script>
    $(function () {
      // ROLE GUARD 1: any logged-in user can listen to published announcements.
      // ROLE GUARD (UI): New / Edit / Publish / Delete controls are admin-only.
      if (!Auth.requireAuth()) return;
      Layout.init({ active: 'announcements' });

      const esc = UI.escapeHtml;
      const isAdmin = Auth.isAdmin();
      let items = [];
      let searchTimer = null;
      const durations = {};

      // One shared audio element for the quick "play" buttons on the cards
      const player = new Audio();
      player.preload = 'none';
      let playingId = null;

      function load() {
        UI.showSkeleton('#list', 4, 'row');
        $('#summary').text('Loading announcements…');
        Api.cachedGet('/announcements', null, 60000) // cached, cleared on create/update/delete
          .then(function (res) {
            items = Api.toList(res).filter(MediaService.isVisible).sort(MediaService.newestFirst);
            render();
          })
          .catch(function (err) {
            $('#summary').text('');
            UI.showError('#list', err.message, load);
          });
      }

      function filtered() {
        const term = $('#search').val().trim().toLowerCase();
        const status = $('#status').val();
        return items.filter(function (a) {
          if (term && (a.title || '').toLowerCase().indexOf(term) === -1) return false;
          if (status === 'published' && a.published === false) return false;
          if (status === 'draft' && a.published !== false) return false;
          return true;
        });
      }

      function cardHtml(a) {
        const id = esc(a.id);
        const title = esc(a.title);
        const url = 'announcement.html?id=' + encodeURIComponent(a.id);

        // ROLE GUARD (UI): admin controls only built for admins
        const adminControls = isAdmin ? `
          <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-100">
            ${MediaService.publishBadge(a)}
            <a href="announcement-form.html?id=${encodeURIComponent(a.id)}" class="btn btn-secondary btn-sm ml-auto" aria-label="Edit ${title}">Edit</a>
            <button type="button" data-toggle-publish="${id}" class="btn btn-secondary btn-sm">${a.published === false ? 'Publish' : 'Unpublish'}<span class="sr-only"> ${title}</span></button>
            <button type="button" data-delete="${id}" class="btn btn-danger btn-sm" aria-label="Delete ${title}">Delete</button>
          </div>` : '';

        return `
          <article class="card p-5 flex flex-col gap-3">
            <div class="flex items-start gap-4">
              <button type="button" data-quick-play="${id}" aria-pressed="false" aria-label="Play: ${title}"
                      class="shrink-0 h-12 w-12 rounded-full bg-indigo-700 text-white flex items-center justify-center hover:bg-indigo-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-600">
                ${MediaService.ICON.play}
              </button>
              <div class="min-w-0 flex-1">
                <h2 class="text-lg font-semibold"><a href="${url}" class="hover:text-indigo-700 focus:outline-none focus-visible:underline">${title}</a></h2>
                <p class="mt-1 text-sm text-slate-600 flex flex-wrap gap-x-2">
                  <span><span class="sr-only">Length: </span><span data-duration-for="${id}">--:--</span></span>
                  <span aria-hidden="true">·</span>
                  <time datetime="${esc(a.created_at)}">${esc(UI.formatDate(a.created_at, false))}</time>
                </p>
                <a href="${url}" class="mt-2 inline-block link text-sm">Full player &amp; details</a>
              </div>
            </div>
            ${adminControls}
          </article>`;
      }

      function fillDuration(a) {
        const $el = $('[data-duration-for="' + a.id + '"]');
        if (a.duration_seconds) { $el.text(UI.formatDuration(a.duration_seconds)); return; }
        if (durations[a.id] !== undefined) {
          $el.text(durations[a.id] ? UI.formatDuration(durations[a.id]) : 'Length unknown');
          return;
        }
        MediaService.getDuration(mediaUrl(a.audio_url), 'audio').then(function (d) {
          durations[a.id] = d;
          $('[data-duration-for="' + a.id + '"]').text(d ? UI.formatDuration(d) : 'Length unknown');
        });
      }

      function render() {
        if (!items.length) {
          $('#summary').text('');
          UI.showEmpty('#list', isAdmin ? 'No announcements yet.' : 'No announcements have been published yet.',
            isAdmin ? '<a href="announcement-form.html" class="btn btn-primary mt-4">Create the first one</a>' : '');
          return;
        }
        const list = filtered();
        if (!list.length) {
          $('#summary').text('0 announcements found');
          UI.showEmpty('#list', 'No announcements match your search.');
          return;
        }
        $('#summary').text(list.length + ' announcement' + (list.length === 1 ? '' : 's'));
        $('#list').attr('aria-busy', 'false').html(list.map(cardHtml).join(''));
        list.forEach(fillDuration);
        updatePlayButtons();
      }

      function updatePlayButtons() {
        $('[data-quick-play]').each(function () {
          const id = $(this).attr('data-quick-play');
          const playing = id === playingId && !player.paused;
          const title = (items.find(function (a) { return a.id === id; }) || {}).title || '';
          $(this).html(playing ? MediaService.ICON.pause : MediaService.ICON.play)
            .attr('aria-pressed', String(playing))
            .attr('aria-label', (playing ? 'Pause: ' : 'Play: ') + title);
        });
      }

      /* ---------- Events ---------- */
      $('#search').on('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(render, 250); });
      $('#status').on('change', render);

      player.addEventListener('play', updatePlayButtons);
      player.addEventListener('pause', updatePlayButtons);
      player.addEventListener('ended', updatePlayButtons);

      $('#list').on('click', '[data-quick-play]', function () {
        const id = $(this).attr('data-quick-play');
        const a = items.find(function (x) { return x.id === id; });
        if (playingId === id && !player.paused) { player.pause(); return; }
        if (playingId !== id) { player.src = mediaUrl(a.audio_url); playingId = id; }
        player.play().catch(function () {
          UI.toast("This audio couldn't be played. Open the details page to download it.", 'error');
        });
      });

      // Admin: publish / unpublish (optimistic - flips right away, reverts if the API fails)
      $('#list').on('click', '[data-toggle-publish]', function () {
        const id = $(this).attr('data-toggle-publish');
        const a = items.find(function (x) { return x.id === id; });
        const publish = a.published === false;
        a.published = publish;
        render();
        MediaService.setPublished('announcements', id, publish)
          .then(function () { UI.toast(publish ? 'Announcement published.' : 'Announcement unpublished. Users can no longer see it.'); })
          .catch(function (err) { a.published = !publish; render(); UI.toast(err.message, 'error'); });
      });

      // Admin: delete
      $('#list').on('click', '[data-delete]', function () {
        const id = $(this).attr('data-delete');
        const a = items.find(function (x) { return x.id === id; });
        MediaService.remove('announcements', a, 'Announcement').then(function (deleted) {
          if (!deleted) return;
          if (playingId === id) { player.pause(); playingId = null; }
          items = items.filter(function (x) { return x.id !== id; });
          render();
        });
      });

      load();
    });
  </script>
</body>
</html>
